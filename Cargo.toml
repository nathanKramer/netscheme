[package]
name = "netscheme"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
fontdue = "0.9"
png = "0.18.1"
softbuffer = "0.4"
stacker = "0.1.25"
ureq = "3.5.0"
url = "2.5.8"
winit = "0.30"

# macOS takes no icon from the window, so the logo is set on the running
# application instead, in `window.rs`. These are already in the tree, through
# arboard.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

# Painting is pixel loops, which an unoptimised build runs several times
# slower. Debug info and assertions stay on.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
