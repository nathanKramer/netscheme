[package]
name = "netscheme"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
fontdue = "0.9"
png = "0.18.1"
softbuffer = "0.4"
stacker = "0.1.25"
ureq = "3.5.0"
url = "2.5.8"
winit = "0.30"

# Painting is pixel loops, which an unoptimised build runs several times
# slower. Debug info and assertions stay on.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
